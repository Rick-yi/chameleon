# ============================================================
# 生产/服务器环境配置（所有敏感项通过环境变量注入）
# 启动：SPRING_PROFILES_ACTIVE=prod java -jar snowy-web-app-3.0.0.jar
# ============================================================
server:
  port: ${SERVER_PORT:82}

spring:
  datasource:
    dynamic:
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:chameleon}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&useInformationSchema=true&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PWD:}
      strict: true
  data:
    redis:
      database: ${REDIS_DB:1}
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:}
      timeout: 10s

# 文件日志目录（非 local 环境启用文件输出）
log:
  path: ${LOG_PATH:./logs}
