# chameleon 编排：后端 + MySQL + Redis
# 使用：docker compose -f snowy-web-app/src/main/resources/docker-compose.yml up -d --build
# 说明：根目录已提供多阶段 Dockerfile（maven 构建 + JRE 运行），build 段可直接使用。
version: '3.8'

services:
  chameleon-web-app:
    build: 
      context: ../../../
      dockerfile: Dockerfile
    image: chameleon-web-app:latest
    container_name: chameleon-web-app
    ports:
      - "82:82"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MYSQL_HOST=chameleon-mysql
      - MYSQL_PORT=3306
      - MYSQL_DB=chameleon
      - MYSQL_USER=root
      - MYSQL_PWD=12345678
      - REDIS_HOST=chameleon-redis
      - REDIS_PORT=6379
      - REDIS_PWD=
      - REDIS_DB=1
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    depends_on:
      - chameleon-mysql
      - chameleon-redis
    networks:
      - chameleon-network

  chameleon-mysql:
    image: mysql:8.0
    container_name: chameleon-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=12345678
      - MYSQL_DATABASE=chameleon
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - chameleon-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  chameleon-redis:
    image: redis:7.0
    container_name: chameleon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - chameleon-network
    command: redis-server --appendonly yes

networks:
  chameleon-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  app-data:
  app-logs:
