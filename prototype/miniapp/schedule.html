<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>家长端 · 课表 · Chameleon 原型</title>
<link rel="stylesheet" href="../assets/prototype.css">
</head>
<body class="mp-stage">
<div class="phone-frame">
  <div class="mp-header"><span class="mp-back">‹</span>我的课表</div>
  <div class="mp-content">
    <div class="flex-between mb16">
      <button class="a-btn sm">‹ 上周</button>
      <span style="font-weight:600;">2026-10-19 ~ 10-25</span>
      <button class="a-btn sm">下周 ›</button>
    </div>

    <div class="mp-card">
      <div class="flex-between" style="margin-bottom:10px;">
        <span style="font-weight:600;">周二 10-20</span>
        <span class="tag tag-blue">今天</span>
      </div>
      <div class="mp-cell"><div><div style="font-weight:500;">少儿美术启蒙 A1</div><div class="text-muted" style="font-size:12px;">09:00-10:30 · A101 · 陈老师</div></div><span class="c-value strong" style="color:var(--success);">待上课</span></div>
    </div>

    <div class="mp-card">
      <div class="flex-between" style="margin-bottom:10px;">
        <span style="font-weight:600;">周六 10-24</span>
      </div>
      <div class="mp-cell"><div><div style="font-weight:500;">少儿美术启蒙 A1</div><div class="text-muted" style="font-size:12px;">09:00-10:30 · A101 · 陈老师</div></div><span class="c-value">待上课</span></div>
    </div>

    <div class="mp-card">
      <div class="flex-between" style="margin-bottom:10px;"><span style="font-weight:600;">周二 10-13</span></div>
      <div class="mp-cell"><div><div style="font-weight:500;">少儿美术启蒙 A1</div><div class="text-muted" style="font-size:12px;">09:00-10:30 · A101 · 陈老师</div></div><span class="c-value">已完成</span></div>
    </div>

    <div class="mp-card">
      <div class="flex-between" style="margin-bottom:10px;"><span style="font-weight:600;">周六 10-10</span></div>
      <div class="mp-cell"><div><div style="font-weight:500;">少儿美术启蒙 A1</div><div class="text-muted" style="font-size:12px;">09:00-10:30 · A101 · 陈老师</div></div><span class="c-value strong" style="color:#d46b08;">已请假</span></div>
    </div>

    <div class="alert alert-info" style="border-radius:12px;">调课、停课会通过订阅消息通知你</div>
  </div>
  <div class="mp-tabbar">
    <div class="mp-tab"><span class="t-icon">🏠</span>首页</div>
    <div class="mp-tab active"><span class="t-icon">📅</span>课表</div>
    <div class="mp-tab"><span class="t-icon">⏱️</span>课时</div>
    <div class="mp-tab"><span class="t-icon">💬</span>消息</div>
    <div class="mp-tab"><span class="t-icon">👤</span>我的</div>
  </div>
</div>
</body>
</html>
