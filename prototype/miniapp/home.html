<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>家长端 · 首页 · Chameleon 原型</title>
<link rel="stylesheet" href="../assets/prototype.css">
</head>
<body class="mp-stage">
<div class="phone-frame">
  <div class="mp-header">童彩艺术</div>
  <div class="mp-content">
    <div class="mp-banner">
      <div class="b-name">王小明</div>
      <div class="b-meta">少儿美术 · 剩余课时 <b>2.5</b> 课时</div>
      <div class="b-meta" style="margin-top:2px;">课包 2026-11-01 到期</div>
    </div>

    <div class="alert alert-warning" style="border-radius:12px;">⚠️ 课时不足：少儿美术仅剩 2.5 课时，请联系机构续费</div>

    <div class="mp-grid">
      <div class="g-item"><span class="g-icon">📅</span>我的课表</div>
      <div class="g-item"><span class="g-icon">⏱️</span>课时明细</div>
      <div class="g-item"><span class="g-icon">🏖️</span>请假</div>
      <div class="g-item"><span class="g-icon">📝</span>作业</div>
      <div class="g-item"><span class="g-icon">💬</span>消息中心</div>
      <div class="g-item"><span class="g-icon">🎓</span>在读课程</div>
      <div class="g-item"><span class="g-icon">📞</span>联系机构</div>
      <div class="g-item"><span class="g-icon">👤</span>我的</div>
    </div>

    <div class="mp-card">
      <div class="flex-between" style="margin-bottom:8px;">
        <span style="font-weight:600;">今日课程</span>
        <a href="schedule.html" class="text-muted" style="font-size:12px;">完整课表 ›</a>
      </div>
      <div class="mp-cell"><span class="c-label">09:00-10:30</span><span class="c-value strong">少儿美术启蒙 A1</span></div>
      <div class="mp-cell"><span class="c-label">教室 A101 · 陈老师</span><span class="c-value" style="color:var(--success);">待上课</span></div>
    </div>

    <div class="mp-card">
      <div class="flex-between" style="margin-bottom:8px;">
        <span style="font-weight:600;">最新通知</span>
        <a href="message.html" class="text-muted" style="font-size:12px;">全部 ›</a>
      </div>
      <div class="mp-cell"><span class="c-label">📢 上课提醒</span><span class="c-value">今天 09:00 少儿美术</span></div>
      <div class="mp-cell"><span class="c-label">✅ 消课通知</span><span class="c-value">10-19 已扣 1.5 课时</span></div>
      <div class="mp-cell"><span class="c-label">⏰ 续费提醒</span><span class="c-value strong">剩余课时不足</span></div>
    </div>
  </div>
  <div class="mp-tabbar">
    <div class="mp-tab active"><span class="t-icon">🏠</span>首页</div>
    <div class="mp-tab"><span class="t-icon">📅</span>课表</div>
    <div class="mp-tab"><span class="t-icon">⏱️</span>课时</div>
    <div class="mp-tab"><span class="t-icon">💬</span>消息<span class="mp-badge" style="margin-left:2px;">3</span></div>
    <div class="mp-tab"><span class="t-icon">👤</span>我的</div>
  </div>
</div>
</body>
</html>
