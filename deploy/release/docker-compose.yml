# ============================================================
# chameleon 预构建部署编排（jar + dist 直接挂载，服务器无需构建）
# 目录结构：
#   app.jar  dist/  nginx.conf  ssl/  sql/  scripts/  .env
# 启动：docker compose up -d
# ============================================================
name: chameleon

services:
  mysql:
    image: mysql:8.0
    container_name: chameleon-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: chameleon
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: chameleon-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  db-init:
    image: mysql:8.0
    container_name: chameleon-db-init
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DB: chameleon
      SKIP_DEMO: "1"
      SQL_DIR: /sql
      TZ: Asia/Shanghai
    volumes:
      - ./sql:/sql:ro
      - ./scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/db-init.sh"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    image: eclipse-temurin:17-jre
    container_name: chameleon-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "82"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: chameleon
      MYSQL_USER: root
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "1"
      LOG_PATH: /app/logs
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseSerialGC"
    volumes:
      - ./app.jar:/app/app.jar:ro
      - app-data:/app/data
      - app-logs:/app/logs
      - upload-data:/defaultUploadFolder
    command: ["sh", "-c", "exec java $$JAVA_OPTS -jar /app/app.jar"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  web:
    image: nginx:1.27-alpine
    container_name: chameleon-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app

volumes:
  mysql-data:
  redis-data:
  app-data:
  app-logs:
  upload-data:
