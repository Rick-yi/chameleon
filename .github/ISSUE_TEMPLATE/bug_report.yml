name: 缺陷报告
description: 报告可复现的功能异常
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**安全漏洞请不要走这里**，见 [SECURITY.md](https://github.com/Rick-yi/chameleon/blob/main/SECURITY.md)。
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: Release 版本号或 commit，以及部署方式（本地 / Docker）
      placeholder: v1.0.0 / 1632355，本地 jar
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 实际发生了什么，页面/接口看到的具体表现
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量给出最小步骤；涉及数据时可脱敏描述
      placeholder: |
        1. 以 superAdmin 登录 demo 机构
        2. 学员详情 → 调课包 → 自定义 25 课时
        3. 收款后剩余课时未累加
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 后端异常栈、浏览器控制台错误。**请先删除口令、真实手机号、身份证等敏感信息**
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已确认这不是安全问题（安全问题走 SECURITY.md 的私密渠道）
          required: true
        - label: 我已在最新的 main 分支上复现过
          required: false
