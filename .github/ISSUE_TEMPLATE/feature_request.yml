name: 功能建议
description: 提出新能力或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前建议先看 [CHANGELOG 已知限制](https://github.com/Rick-yi/chameleon/blob/main/CHANGELOG.md) 与 [架构总览](https://github.com/Rick-yi/chameleon/blob/main/ARCHITECTURE.md)，避免与既有设计取舍冲突。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下会遇到什么问题（机构角色：校长/教务/老师/前台/财务）
      placeholder: 前台在收款时……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 多租户 / 平台运营
        - 学员档案
        - 招生 CRM
        - 课务（课程/班级/排课/点名）
        - 财务（收款/退费/课时）
        - 学杂费
        - 报表
        - 移动端
        - 部署与运维
        - 其他
    validations:
      required: true
