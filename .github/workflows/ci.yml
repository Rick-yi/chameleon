name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

# 同一分支只保留最新一次运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端编译与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 编译
        run: mvn -B -DskipTests compile

      # 现有单测都是纯规则测试（不连库），CI 无需 MySQL/Redis
      - name: 单元测试
        run: mvn -B test

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snowy-admin-web
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: snowy-admin-web/package-lock.json

      - name: 安装依赖
        run: npm ci

      # 存量代码有大量历史格式差异（CRLF/Prettier 排版），暂不阻断构建。
      # 新增代码应保持 lint 干净；待存量格式化统一后再去掉 continue-on-error。
      - name: 代码规范检查
        continue-on-error: true
        run: npm run lint

      - name: 生产构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-dist
          path: snowy-admin-web/dist
          retention-days: 7
